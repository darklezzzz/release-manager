name: Release build
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6.0.1
        with:
          version: "0.12.18"
      - run: uv sync --locked
      - name: Check release tag before building artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --locked release-manager check-tag --tag "$RELEASE_TAG"
      - run: uv run --locked pytest -v
      - run: uv build
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
